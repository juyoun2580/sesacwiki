<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>저장한 단어 — 마이핸드북 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/my.css">
  <link rel="stylesheet" href="/assets/css/pagination.css">
  <link rel="stylesheet" href="/assets/css/modal.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="mywords" class="page page--active" aria-label="저장한 단어">
      <div class="shell">
        <div class="page__content">
          <a class="back-link" href="/pages/my/mypage.html">‹ 마이페이지로 돌아가기</a>
          <h1 class="page-title">저장한 단어<span class="icon icon--leaf" aria-hidden="true"></span></h1>
          <p class="page-subtitle">모르는 단어를 저장하고 복습하여 어휘력을 키워보세요.</p>

          <div class="my-toolbar">
            <div class="my-toolbar__search">
              <label class="sr-only" for="word-search">단어 검색</label>
              <span class="icon icon--search" aria-hidden="true"></span>
              <input type="text" id="word-search" class="my-toolbar__input" placeholder="단어를 검색하세요">
            </div>
            <label class="sr-only" for="word-category">카테고리 선택</label>
            <select id="word-category" class="my-toolbar__select">
              <option>전체 카테고리</option>
              <option>CS/IT</option>
              <option>Java</option>
              <option>SQL</option>
            </select>
            <div class="sort-pills">
              <button type="button" class="sort-pill" data-sort="term">영어순</button>
              <button type="button" class="sort-pill" data-sort="definition">이름순</button>
            </div>
            <button type="button" class="btn btn--outline btn--sm" data-action="toggle-favorites-only" aria-pressed="false"><span class="icon icon--star" aria-hidden="true"></span>즐겨찾기만</button>
            <button type="button" class="btn btn--primary btn--sm" data-action="open-modal" data-word="">+ 단어
              추가</button>
          </div>

          <div class="word-stats">
            <div class="word-stats__box">
              <p class="word-stats__value" id="word-total-count">0</p>
              <p class="word-stats__label">전체 단어</p>
            </div>
          </div>

          <div class="word-export-bar">
            <button type="button" class="word-export-bar__btn word-export-bar__btn--csv" data-action="export-words-csv"><span class="icon icon--file-text" aria-hidden="true"></span>Export to CSV</button>
            <button type="button" class="word-export-bar__btn word-export-bar__btn--word" data-action="export-words-doc"><span class="icon icon--file-text" aria-hidden="true"></span>Export to Word</button>
          </div>
          <div class="word-row-groups" id="word-row-groups"></div>

          <nav class="pagination" id="wordsPagination" aria-label="페이지 네비게이션"></nav>
        </div>
        <aside class="side-panel" aria-label="단어 퀴즈 및 카테고리별 단어 수">
          <div class="word-quiz">
            <p class="word-quiz__title"><span class="icon icon--message" aria-hidden="true"></span>오늘의 단어 퀴즈</p>
            <p class="word-quiz__hint">저장한 단어로 퀴즈를 풀어보세요!</p>
            <p class="word-quiz__question">Algorithm 의 의미로 가장 적절한 것은?</p>
            <div class="word-quiz__option-list">
              <button type="button" class="word-quiz__option">① 알고리즘</button>
              <button type="button" class="word-quiz__option">② 데이터베이스</button>
              <button type="button" class="word-quiz__option">③ 사용자 인터페이스</button>
              <button type="button" class="word-quiz__option">④ 운영체제</button>
            </div>
            <button type="button" class="word-quiz__submit" data-action="toast" data-message="퀴즈를 시작해요! +30P 도전!">퀴즈
              시작하기</button>
          </div>
          <div class="section-title section-title--sm">카테고리별 단어 수 <button type="button" class="section-title__link">전체보기
              ›</button></div>
          <div class="category-stat-row">
            <span class="category-stat-row__label">CS/IT</span>
            <div class="progress-bar progress-bar--thin" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100">
              <div class="progress-bar__fill progress-bar__fill--green" data-progress="0"></div>
            </div>
            <span class="category-stat-row__count">0개</span>
          </div>
          <div class="category-stat-row">
            <span class="category-stat-row__label">Java</span>
            <div class="progress-bar progress-bar--thin" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100">
              <div class="progress-bar__fill progress-bar__fill--blue" data-progress="0"></div>
            </div>
            <span class="category-stat-row__count">0개</span>
          </div>
          <div class="category-stat-row">
            <span class="category-stat-row__label">SQL</span>
            <div class="progress-bar progress-bar--thin" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100">
              <div class="progress-bar__fill progress-bar__fill--green" data-progress="0"></div>
            </div>
            <span class="category-stat-row__count">0개</span>
          </div>
          <div class="category-stat-row">
            <span class="category-stat-row__label">비즈니스</span>
            <div class="progress-bar progress-bar--thin" role="progressbar" aria-valuenow="0" aria-valuemin="0"
              aria-valuemax="100">
              <div class="progress-bar__fill progress-bar__fill--orange" data-progress="0"></div>
            </div>
            <span class="category-stat-row__count">0개</span>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="word-modal-mount"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <!-- <script src="/assets/js/auth.js" defer></script> -->
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/components/modal.js" defer></script>
  <script src="/assets/js/components/pagination.js" defer></script>
  <script src="/assets/js/pages/quiz.js" defer></script>
  <script src="/assets/js/pages/mypage.js" defer></script>
</body>

</html>
