<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css" />
  <link rel="stylesheet" href="/assets/css/variables.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/pages/my.css" />
  <link rel="stylesheet" href="/assets/css/pages/mypage.css" />
  <link rel="stylesheet" href="/assets/css/modal.css" />
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="mypage" class="page page--active" aria-label="마이페이지 대시보드">
      <div class="shell">
        <div class="page__content">
          <h1 class="page-title">마이페이지<span class="icon icon--leaf" aria-hidden="true"></span></h1>
          <p class="page-subtitle">
            나의 성장 현황과 활동을 한눈에 확인하세요.
          </p>

          <div class="profile-card" id="profile-card">
            <span class="profile-card__avatar" id="profile-avatar" aria-hidden="true"><span class="icon icon--leaf"></span></span>
            <div class="profile-card__body">
              <div class="profile-card__name-row">
                <p class="profile-card__name" id="profile-name">User Name</p>
                <span class="profile-card__level-tag">Lv.1 새싹</span>
              </div>
              <p class="profile-card__username" id="profile-username">
                @user-id
              </p>
            </div>
            <div class="profile-card__actions">
              <a href="/pages/my/edit.html" class="btn btn--primary btn--sm">프로필 수정</a>
            </div>
          </div>

          <div class="level-card">
            <div class="level-card__header">
              <div class="section-title">
                학습 레벨
              </div>
              <span class="level-card__badge">Lv.1</span>
            </div>
            <div class="level-track">
              <div class="level-track__stage level-track__stage--active" data-stage="0">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv1-sprout"></span></span>
                <span class="level-track__label">새싹</span>
              </div>
              <div class="level-track__stage" data-stage="1">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv2-stem"></span></span>
                <span class="level-track__label">줄기</span>
              </div>
              <div class="level-track__stage" data-stage="2">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv3-leaf"></span></span>
                <span class="level-track__label">잎</span>
              </div>
              <div class="level-track__stage" data-stage="3">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv4-tree"></span></span>
                <span class="level-track__label">나무</span>
              </div>
              <div class="level-track__stage" data-stage="4">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv5-flower"></span></span>
                <span class="level-track__label">꽃</span>
              </div>
              <div class="level-track__stage" data-stage="5">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv6-fruit"></span></span>
                <span class="level-track__label">열매</span>
              </div>
              <div class="level-track__stage" data-stage="6">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv7-water"></span></span>
                <span class="level-track__label">물</span>
              </div>
              <div class="level-track__stage" data-stage="7">
                <span class="level-track__icon" aria-hidden="true"><span class="icon icon--lv8-cosmos"></span></span>
                <span class="level-track__label">우주</span>
              </div>
            </div>
            <div class="progress-bar level-track__bar" role="progressbar" aria-valuenow="10" aria-valuemin="0"
              aria-valuemax="100">
              <div class="progress-bar__fill progress-bar__fill--green" data-progress="10"></div>
            </div>
            <p class="level-track__hint">
              다음 단계(줄기)까지 <strong>10%</strong> 남았어요
            </p>
          </div>

          <div class="category-card-grid">
            <a href="/pages/my/words.html" class="category-card">
              <span class="category-card__icon-box category-card__icon-box--green" aria-hidden="true"><span class="icon icon--book"></span></span>
              <span class="category-card__label">단어장</span>
            </a>
            <a type="button" class="category-card">
              <span class="category-card__icon-box category-card__icon-box--gold" aria-hidden="true"><span class="icon icon--edit"></span></span>
              <span class="category-card__label">하이라이트</span>
            </a>
          </div>
          
        </div>

      </div>
    </section>
  </main>



  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="word-modal-mount"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/components/modal.js" defer></script>
  <script src="/assets/js/pages/mypage.js" defer></script>
</body>

</html>
