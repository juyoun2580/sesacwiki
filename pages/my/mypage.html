<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이페이지 — Sesac Wiki</title>
    <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/my.css" />
    <link rel="stylesheet" href="/assets/css/pages/mypage.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <header class="header" id="header-mount"></header>

    <nav class="nav" id="nav-mount" aria-label="주 메뉴"></nav>


    <main id="main-content">
      <section
        id="mypage"
        class="page page--active"
        aria-label="마이페이지 대시보드"
      >
        <div class="shell">
          <div class="page__content">
            <h1 class="page-title">My Dashboard 🌱</h1>
            <p class="page-subtitle">
              나의 성장 현황과 활동을 한눈에 확인하세요.
            </p>

            <div class="profile-card" id="profile-card">
              <span
                class="profile-card__avatar"
                id="profile-avatar"
                aria-hidden="true"
                >🌱</span
              >
              <div class="profile-card__body">
                <p class="profile-card__name" id="profile-name">DAJEONG KIM</p>
                <p class="profile-card__username" id="profile-username">
                  @kdj4027
                </p>
              </div>
              <div class="profile-card__actions">
                <a href="/pages/my/edit.html" class="btn btn--primary btn--sm"
                  >Edit profile</a
                >
                <button
                  type="button"
                  class="btn btn--outline btn--sm"
                  data-action="toast"
                  data-message="프로필 보기 화면은 준비 중이에요!"
                >
                  See profile
                </button>
              </div>
            </div>

            <div class="level-card">
              <div class="level-card__header">
                <div class="section-title section-title--sm">
                  Level Progress
                </div>
                <span class="level-card__badge">Lv.1</span>
              </div>
              <div class="level-track">
                <div
                  class="level-track__stage level-track__stage--active"
                  data-stage="0"
                >
                  <span class="level-track__icon" aria-hidden="true">🌱</span>
                  <span class="level-track__label">새싹</span>
                </div>
                <div class="level-track__stage" data-stage="1">
                  <span class="level-track__icon" aria-hidden="true">🌿</span>
                  <span class="level-track__label">줄기</span>
                </div>
                <div class="level-track__stage" data-stage="2">
                  <span class="level-track__icon" aria-hidden="true">🍃</span>
                  <span class="level-track__label">잎</span>
                </div>
                <div class="level-track__stage" data-stage="3">
                  <span class="level-track__icon" aria-hidden="true">🌳</span>
                  <span class="level-track__label">나무</span>
                </div>
                <div class="level-track__stage" data-stage="4">
                  <span class="level-track__icon" aria-hidden="true">🌸</span>
                  <span class="level-track__label">꽃</span>
                </div>
                <div class="level-track__stage" data-stage="5">
                  <span class="level-track__icon" aria-hidden="true">🍎</span>
                  <span class="level-track__label">열매</span>
                </div>
                <div class="level-track__stage" data-stage="6">
                  <span class="level-track__icon" aria-hidden="true">💧</span>
                  <span class="level-track__label">물</span>
                </div>
                <div class="level-track__stage" data-stage="7">
                  <span class="level-track__icon" aria-hidden="true">🌌</span>
                  <span class="level-track__label">우주</span>
                </div>
              </div>
              <div
                class="progress-bar level-track__bar"
                role="progressbar"
                aria-valuenow="35"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div
                  class="progress-bar__fill progress-bar__fill--green"
                  data-progress="35"
                ></div>
              </div>
              <p class="level-track__hint">
                다음 단계(줄기)까지 <strong>35%</strong> 남았어요 · 1,240P /
                2,000P · 8단계(우주) 이후에는 Lv.9부터 새싹부터 다시 순환하며
                계속 성장해요
              </p>
            </div>

            <div class="category-card-grid">
              <button type="button" class="category-card" data-category="words">
                <span class="category-card__icon" aria-hidden="true">📓</span>
                <span class="category-card__label">저장한 단어</span>
                <span class="category-card__desc">단어장 · 내보내기</span>
              </button>
              <button type="button" class="category-card" data-category="quiz">
                <span class="category-card__icon" aria-hidden="true">🎯</span>
                <span class="category-card__label">퀴즈 도전</span>
                <span class="category-card__desc">뱃지 잠금 해제</span>
              </button>
            </div>

            <div class="category-detail-panel" id="category-detail-panel"></div>
          </div>

          <aside class="side-panel" aria-label="챌린지 및 활동 뱃지">
            <div class="achievement-panel">
              <div
                class="achievement-tabs"
                role="tablist"
                aria-label="챌린지/활동 전환"
              >
                <button
                  type="button"
                  class="achievement-tab achievement-tab--active"
                  role="tab"
                  aria-selected="true"
                  data-tab="challenges"
                >
                  Challenges
                </button>
                <button
                  type="button"
                  class="achievement-tab"
                  role="tab"
                  aria-selected="false"
                  data-tab="activities"
                >
                  Activities
                </button>
              </div>

              <div
                class="achievement-tab-content achievement-tab-content--active"
                data-tab-panel="challenges"
              >
                <div class="challenge-list">
                  <div class="challenge-row">
                    <p class="challenge-row__title">
                      이번 주 새싹위키 3개 완독하기
                    </p>
                    <div
                      class="progress-bar progress-bar--thin"
                      role="progressbar"
                      aria-valuenow="66"
                      aria-valuemin="0"
                      aria-valuemax="100"
                    >
                      <div
                        class="progress-bar__fill progress-bar__fill--green"
                        data-progress="66"
                      ></div>
                    </div>
                  </div>
                  <div class="challenge-row">
                    <p class="challenge-row__title">모의고사 1회 응시하기</p>
                    <div
                      class="progress-bar progress-bar--thin"
                      role="progressbar"
                      aria-valuenow="100"
                      aria-valuemin="0"
                      aria-valuemax="100"
                    >
                      <div
                        class="progress-bar__fill progress-bar__fill--blue"
                        data-progress="100"
                      ></div>
                    </div>
                  </div>
                  <div class="challenge-row">
                    <p class="challenge-row__title">단어 10개 저장하기</p>
                    <div
                      class="progress-bar progress-bar--thin"
                      role="progressbar"
                      aria-valuenow="40"
                      aria-valuemin="0"
                      aria-valuemax="100"
                    >
                      <div
                        class="progress-bar__fill progress-bar__fill--orange"
                        data-progress="40"
                      ></div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="achievement-tab-content" data-tab-panel="activities">
                <div class="badge-grid--compact" id="badge-grid"></div>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="wmodal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wmodal-title">
        <p class="modal__title" id="wmodal-title">📓 단어장에 추가</p>
        <div class="modal__field">
          <label class="modal__label" for="mword">단어</label>
          <input class="modal__input" id="mword" placeholder="단어를 입력하세요">
        </div>
        <div class="modal__field">
          <label class="modal__label" for="mmeaning">뜻 (한국어)</label>
          <input class="modal__input" id="mmeaning" placeholder="뜻을 입력하세요">
        </div>
        <div class="modal__field">
          <label class="modal__label" for="mcategory">카테고리</label>
          <select class="modal__input" id="mcategory">
            <option>SQL</option>
            <option>Java</option>
            <option>CS/IT</option>
            <option>비즈니스</option>
            <option>기타</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--outline btn--sm" data-action="close-modal">취소</button>
          <button type="button" class="btn btn--primary btn--sm" data-action="save-word">단어장에 저장</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/assets/js/toast.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
    <script src="/assets/js/supabase-client.js" defer></script>
    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/api.js" defer></script>
    <script src="/assets/js/components/header.js" defer></script>
    <script src="/assets/js/components/nav.js" defer></script>
    <script src="/assets/js/app.js" defer></script>
    <script src="/assets/js/ui.js" defer></script>
    <script src="/assets/js/modal.js" defer></script>
    <script src="/assets/js/pages/mypage.js" defer></script>
  </body>
</html>
