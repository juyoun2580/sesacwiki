<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 수정 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search-dropdown.css">
  <link rel="stylesheet" href="/assets/css/pages/mypage.css">
  <link rel="stylesheet" href="/assets/css/pages/my.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="mypage-edit" class="page page--active" aria-label="프로필 수정">
      <div class="shell">
        <div class="page__content settings-content">
          <a class="back-link quiz-header__back" href="/pages/my/index.html"><span class="icon icon--chevron-left"></span> 뒤로가기</a>
          <h1 class="page-title settings-content__title">프로필 수정</h1>
          <p class="page-subtitle">계정 정보와 알림 설정을 관리하세요.</p>

          <div class="settings-section">
            <div class="settings-section__title">
              <p class="settings-section__title-main">계정 정보</p>
              <p class="settings-section__title-sub">계정 기본 정보를 관리하세요.</p>
            </div>
            <div class="settings-section__card">
              <form class="settings-form" id="account-form" novalidate>
                <div class="settings-field">
                  <label class="settings-label" for="acc-name">닉네임</label>
                  <input type="text" id="acc-name" class="settings-input" value="">
                </div>
                <div class="settings-field">
                  <label class="settings-label" for="email-input">이메일</label>
                  <input type="email" id="email-input" class="settings-input" value="">
                  <p class="settings-warning"><span class="icon icon--alert" aria-hidden="true"></span>이메일을 변경하면 확인 메일이 발송돼요.</p>
                </div>
                <div class="settings-field">
                  <label class="settings-label" for="password-input">비밀번호</label>
                  <input type="password" id="password-input" class="settings-input" placeholder="변경하지 않으려면 비워두세요" autocomplete="new-password">
                </div>
                <div class="settings-form__footer">
                  <button type="submit" class="btn btn--primary">저장</button>
                </div>
              </form>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-section__title">
              <p class="settings-section__title-main">프로필 사진</p>
              <p class="settings-section__title-sub">프로필 사진을 변경할 수 있어요.</p>
            </div>
            <div class="settings-section__card">
              <form id="avatar-form" novalidate>
                <div class="settings-avatar-row">
                  <span class="settings-avatar-preview" id="avatar-preview" aria-hidden="true">
                    <img src="/assets/img/profile-sample.png" alt="">
                  </span>
                  <label class="btn btn--outline--secondary settings-file-label" for="avatar-input">사진 선택</label>
                  <input type="file" id="avatar-input" accept="image/*" class="sr-only">
                </div>
                <div class="settings-form__footer">
                  <button type="submit" class="btn btn--primary">업로드 & 저장</button>
                </div>
              </form>
            </div>
          </div>

          <div class="settings-section settings-danger">
            <div class="settings-section__title">
              <p class="settings-section__title-main">계정 삭제</p>
              <p class="settings-section__title-sub">계정을 삭제하면 되돌릴 수 없어요.</p>
            </div>
            <div class="settings-section__card">
              <p class="settings-danger__warning">계정 삭제는 영구적이며 되돌릴 수 없습니다. 삭제 후에는 누구도 계정을 복구할 수 없어요.</p>
              <label class="settings-checkbox-row" for="delete-confirm">
                <input type="checkbox" id="delete-confirm">
                <span>이 작업이 영구적이며 되돌릴 수 없음을 이해했습니다</span>
              </label>
              <div class="settings-form__footer">
                <button type="button" class="btn btn--danger" id="delete-account-btn" disabled>계정 삭제</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/profile.js" defer></script>
  <script src="/assets/js/components/search-dropdown.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/pages/mypage.js" defer></script>
</body>

</html>
