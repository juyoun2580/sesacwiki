<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>즐겨찾기 — 마이핸드북 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search-dropdown.css">
  <link rel="stylesheet" href="/assets/css/pages/my.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="myfav" class="page page--active" aria-label="즐겨찾기">
      <div class="shell">
        <div class="page__content">
          <h1 class="page-title">즐겨찾기 ⭐</h1>
          <p class="page-subtitle">중요하다고 표시한 자료를 모아봤어요.</p>

          <div class="filter-tabs">
            <button type="button" class="filter-tab filter-tab--active">전체 (0)</button>
            <button type="button" class="filter-tab">문서 (0)</button>
            <button type="button" class="filter-tab">노트 (0)</button>
            <button type="button" class="filter-tab">단어 (0)</button>
          </div>

          <ul class="fav-row-list">
            <li class="fav-row-list__empty">아직 즐겨찾기한 자료가 없습니다.</li>
          </ul>

          <div class="fav-complete">
            <p class="fav-complete__icon" aria-hidden="true">🌿</p>
            <p class="fav-complete__message">즐겨찾기한 자료를 잘 활용해서 목표를 이뤄보세요! 🌱</p>
            <br>
            <button type="button" class="btn btn--outline fav-complete__action" data-action="toast"
              data-message="모두 확인 완료!">모두 확인했어요!</button>
          </div>
        </div>
        <aside class="side-panel" aria-label="즐겨찾기 요약">
          <p class="section-title section-title--sm">즐겨찾기 요약</p>
          <div class="fav-summary">
            <span class="fav-summary__icon" aria-hidden="true">⭐</span>
            <p class="fav-summary__value">0개</p>
            <p class="fav-summary__label">즐겨찾기한 자료</p>
          </div>
          <div class="divider"></div>
          <div class="fav-summary-list">
            <div class="fav-summary-list__row"><span>📄 문서</span><span class="fav-summary-list__count">0개</span></div>
            <div class="fav-summary-list__row"><span>📋 노트</span><span class="fav-summary-list__count">0개</span></div>
            <div class="fav-summary-list__row"><span>#️⃣ 단어</span><span class="fav-summary-list__count">0개</span></div>
          </div>
          <p class="section-title section-title--sm">최근 추가한 즐겨찾기 <button type="button" class="section-title__link">전체보기
              ›</button></p>
          <ul class="fav-recent-list">
            <li class="fav-recent-list__empty">아직 추가한 즐겨찾기가 없습니다.</li>
          </ul>
          <button type="button" class="btn btn--primary btn--sm fav-summary__submit" data-action="toast"
            data-message="모두 확인 완료!">모두 확인했어요!</button>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/profile.js" defer></script>
  <script src="/assets/js/components/search-dropdown.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
</body>

</html>
