<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모의고사 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/exam.css">
  <link rel="stylesheet" href="/assets/css/toolbar.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="exam" class="page page--active" aria-label="모의고사">
      <div class="shell">
        <aside class="sidebar" aria-label="모의고사 카테고리">
          <div class="sidebar-wrap">
            <p class="sidebar__label">모의고사</p>
            <button type="button" class="sidebar__item sidebar__item--active" data-category="전과목">전과목</button>
            <button type="button" class="sidebar__item" data-category="세일즈포스">세일즈포스</button>
            <button type="button" class="sidebar__item" data-category="Java">Java</button>
            <button type="button" class="sidebar__item" data-category="SQL">SQL</button>
            <button type="button" class="sidebar__item" data-category="HTML">HTML</button>
            <button type="button" class="sidebar__item" data-category="CSS">CSS</button>
            <button type="button" class="sidebar__item" data-category="JavaScript">JavaScript</button>
            <button type="button" class="sidebar__item" data-category="기타">기타</button>
          </div>
          <div class="card exam-sidebar-card">
            <p class="exam-sidebar-card__title">꾸준히 풀면 실력이 쑥쑥!</p>
            <p class="exam-sidebar-card__desc">오늘도 한 문제 도전해보세요</p>
            <img src="/assets/img/graphic-mascot-book.svg" alt="" class="mascot-graphic exam-sidebar-card__graphic">
          </div>

        </aside>
        <div class="page__content">
          <h1 class="page-title">모의고사<span class="icon icon--leaf" aria-hidden="true"></span></h1>
          <p class="page-subtitle">중간평가, 실습평가, 취업 대비 문제를 풀어보세요.</p>

          <!-- <div class="filter-tabs">
            <button type="button" class="filter-tab filter-tab--active" data-category="전과목">전과목</button>
            <button type="button" class="filter-tab" data-category="세일즈포스">세일즈포스</button>
            <button type="button" class="filter-tab" data-category="Java">Java</button>
            <button type="button" class="filter-tab" data-category="SQL">SQL</button>
            <button type="button" class="filter-tab" data-category="HTML">HTML</button>
            <button type="button" class="filter-tab" data-category="CSS">CSS</button>
            <button type="button" class="filter-tab" data-category="JavaScript">JavaScript</button>
            <button type="button" class="filter-tab" data-category="기타">기타</button>
          </div> -->
          <div class="toolbar" id="examToolbar">
            <div class="toolbar__search"></div>
            <div class="toolbar__actions"></div>
          </div>

          <ul class="exam-row-list" id="exam-row-list"></ul>
        </div>
        <aside class="side-panel" aria-label="내 모의고사 현황">
          <div class="exam-side-panel">
            <div class="card">
              <div class="card__body">
                <div class="section-title">내 모의고사 현황</div>
                <div class="exam-status-ring-wrap">
                  <div class="score-ring">
                    <svg id="exam-score-ring-svg" viewBox="0 0 92 92" width="92" height="92" role="img" aria-label="전체 평균 0%">
                      <defs>
                        <linearGradient id="exam-score-ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="var(--green-600)" />
                          <stop offset="100%" stop-color="var(--green-900)" />
                        </linearGradient>
                      </defs>
                      <circle class="score-ring__bg" cx="46" cy="46" r="38" stroke-width="9" />
                      <circle id="exam-score-ring-fill" class="score-ring__fill" cx="46" cy="46" r="38"
                        stroke="url(#exam-score-ring-gradient)" stroke-width="9" stroke-dasharray="188"
                        stroke-dashoffset="188" transform="rotate(-90 46 46)" />
                    </svg>
                    <div class="score-ring__text"><span id="exam-score-ring-value" class="score-ring__value">0%</span></div>
                  </div>
                </div>
                <div class="exam-stat">
                  <span class="exam-stat__label"><span class="exam-stat__icon-box exam-stat__icon-box--green"><span class="icon icon--file" aria-hidden="true"></span></span>응시한 시험</span>
                  <span id="exam-stat-attempt-count" class="exam-stat__value">-</span>
                </div>
                <div class="exam-stat">
                  <span class="exam-stat__label"><span class="exam-stat__icon-box exam-stat__icon-box--green"><span class="icon icon--check" aria-hidden="true"></span></span>평균 점수</span>
                  <span id="exam-stat-avg-score" class="exam-stat__value">-</span>
                </div>
                <div class="exam-stat">
                  <span class="exam-stat__label"><span class="exam-stat__icon-box exam-stat__icon-box--gold"><span class="icon icon--star-filled" aria-hidden="true"></span></span>최고 점수</span>
                  <span id="exam-stat-best-score" class="exam-stat__value">-</span>
                </div>
                <div class="exam-stat">
                  <span class="exam-stat__label"><span class="exam-stat__icon-box exam-stat__icon-box--gold"><span class="icon icon--clock" aria-hidden="true"></span></span>획득 포인트</span>
                  <span id="exam-stat-earned-points" class="exam-stat__value">-</span>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card__body">
                <div class="section-title">최근 응시한 시험 <button type="button" id="exam-recent-toggle"
                    class="section-title__link">전체보기</button></div>
                <div id="exam-recent-list">
                  <p class="wrong-note-empty">불러오는 중...</p>
                </div>
              </div>
            </div>

            <div class="card exam-cta-card">
              <div class="card__body">
                <p class="exam-cta-card__title"><span class="icon icon--edit" aria-hidden="true"></span>오답노트 바로가기</p>
                <p class="exam-cta-card__desc">틀린 문제를 다시 풀고 약점을 보완해보세요!</p>
                <button type="button" class="btn btn--secondary btn--sm exam-cta-card__btn">오답노트 보기</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/components/toolbar.js" defer></script>
  <script src="/assets/js/pages/exam.js" defer></script>
</body>

</html>
