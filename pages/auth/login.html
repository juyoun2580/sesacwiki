<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/img/favi.png" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favi.png">
  <!-- Apple -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon.png">
  <!-- Theme Color -->
  <meta name="theme-color" content="#2f7a4d">
  <title>로그인 — Sesac Wiki</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>

<body class="auth-body">
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <main id="main-content" class="auth-shell">
    <section id="login" class="auth-card" aria-label="로그인">
      <a href="/index.html" class="auth-card__logo">
        <img src="/assets/img/logo-lockup.svg" alt="새싹Wiki" />
      </a>
      <h1 class="auth-card__title">로그인</h1>
      <p class="auth-card__subtitle">이메일로 로그인하고 나만의 취업 핸드북을 이어가세요.</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="login-email">이메일</label>
          <input type="email" id="login-email" class="auth-input" placeholder="example@sesac.com"
            autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="login-password">비밀번호</label>
          <input type="password" id="login-password" class="auth-input" placeholder="비밀번호를 입력하세요"
            autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn--primary auth-form__submit">로그인</button>
      </form>

      <p class="auth-card__switch">계정이 없으신가요? <a href="/pages/auth/signup.html" class="auth-card__switch-link">가입하기</a></p>

      <div class="auth-pending" id="auth-pending" hidden>
        <p class="empty-state__icon" aria-hidden="true"><span class="icon icon--email"></span></p>
        <p class="auth-pending__title">인증 메일을 보냈어요</p>
        <p class="auth-pending__desc"><strong id="auth-pending-email"></strong> 주소로 보낸 인증 링크를 클릭하면 로그인이 완료돼요.</p>
        <button type="button" class="auth-pending__resend" data-action="resend-verification">인증 메일 다시 보내기</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
</body>

</html>
