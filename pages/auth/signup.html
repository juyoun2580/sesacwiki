<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>

<body class="auth-body">
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <main id="main-content" class="auth-shell">
    <section id="signup" class="auth-card" aria-label="회원가입">
      <div class="auth-card__logo">
        <img src="/assets/img/logo-lockup.svg" alt="새싹Wiki" />
      </div>
      <h1 class="auth-card__title">회원가입</h1>
      <p class="auth-card__subtitle">이메일로 가입하고 나만의 취업 핸드북을 시작하세요.</p>

      <form class="auth-form" id="signup-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="signup-name">이름</label>
          <input type="text" id="signup-name" class="auth-input" placeholder="이름을 입력하세요" autocomplete="name"
            required>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="signup-email">이메일</label>
          <input type="email" id="signup-email" class="auth-input" placeholder="example@sesac.com"
            autocomplete="email" required>
        </div>

        <label class="auth-checkbox-row" for="signup-agree-required">
          <input type="checkbox" id="signup-agree-required" required>
          <span><span class="auth-checkbox-row__required">[필수]</span> 개인정보 수집 및 이용약관에 동의합니다.</span>
        </label>

        <button type="submit" class="btn btn--primary auth-form__submit">이메일 회원가입</button>
      </form>

      <p class="auth-card__switch">이미 계정이 있으신가요? <a href="/pages/auth/login.html" class="auth-card__switch-link">로그인</a></p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
</body>

</html>
