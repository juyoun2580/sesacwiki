<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새싹위키 — Sesac Wiki</title>
  <link rel="icon" href="/assets/img/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search-dropdown.css">
  <link rel="stylesheet" href="/assets/css/pages/wiki.css">
  <link rel="stylesheet" href="/assets/css/pagination.css">
  <link rel="stylesheet" href="/assets/css/toolbar.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>


  <main id="main-content">
    <section id="wiki" class="page page--active" aria-label="새싹위키">
      <div class="shell">
        <aside class="sidebar" aria-label="카테고리">
          <div class="sidebar-wrap">
            <p class="sidebar__label">카테고리</p>
            <button type="button" class="sidebar__item sidebar__item--active" data-category="전체">전과목</button>
            <button type="button" class="sidebar__item" data-category="Salesforce">세일즈포스</button>
            <button type="button" class="sidebar__item" data-category="Java">Java</button>
            <button type="button" class="sidebar__item" data-category="SQL">SQL</button>
            <button type="button" class="sidebar__item" data-category="HTML">HTML</button>
            <button type="button" class="sidebar__item" data-category="CSS">CSS</button>
            <button type="button" class="sidebar__item" data-category="JavaScript">JavaScript</button>
            <button type="button" class="sidebar__item" data-category="Git">기타</button>
          </div>
        </aside>

        <div class="page__content">
          <h1 class="page-title">새싹위키<span class="icon icon--leaf" aria-hidden="true"></span></h1>
          <p class="page-subtitle">새싹 과정에 필요한 모든 지식을 모아놓은 백과사전</p>

          <div class="toolbar" id="wikiToolbar">
            <div class="toolbar__search"></div>
            <div class="toolbar__actions"></div>
          </div>

          <ul class="wiki-row-list" id="wikiRowList"></ul>

          <nav class="pagination" id="wikiPagination" aria-label="페이지 네비게이션"></nav>
        </div>
        
        <aside class="side-panel" aria-label="즐겨찾기">
          <div class="favorite-box">
            <div class="favorite-box__header">
              <p class="section-title">즐겨찾기</p>
              <button type="button" class="favorite-box__toggle" id="wikiFavoriteToggle" hidden>
                <span class="icon icon--chevron-down" aria-hidden="true"></span>펼치기
              </button>
            </div>
            <ul class="favorite-list" id="wikiFavoriteList"></ul>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/profile.js" defer></script>
  <script src="/assets/js/components/search-dropdown.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/components/pagination.js" defer></script>
  <script src="/assets/js/components/toolbar.js" defer></script>
  <script src="/assets/js/pages/wiki.js" defer></script>
</body>

</html>
