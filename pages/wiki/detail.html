<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/assets/img/favi.png" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favi.png">
  <!-- Apple -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icon.png">
  <!-- Theme Color -->
  <meta name="theme-color" content="#2f7a4d">
  <title>SQL SELECT 문법 — Sesac Wiki</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/search-dropdown.css">
  <link rel="stylesheet" href="/assets/css/pages/wiki.css">
  <link rel="stylesheet" href="/assets/css/modal.css">
</head>

<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <header class="header" id="header-mount"></header>

  <main id="main-content">
    <section id="detail" class="page page--active" aria-label="위키 상세">
      <div class="shell">
        <aside class="sidebar" aria-label="목차">
          <a class="back-link quiz-header__back" href="/pages/wiki/index.html"><span class="icon icon--chevron-left"></span> 뒤로가기</a>
          <nav class="toc sidebar-wrap" id="wikiToc" aria-label="목차">
            <p class="sidebar__label">목차</p>
          </nav>
        </aside>

        <div class="page__content">
          <article class="card wiki-detail-card">
            <div class="card__body">
              <div class="article-header">
                <h1 class="article-header__title" id="wikiDetailTitle"></h1>
                <span class="tag" id="wikiDetailCategoryTag"></span><span class="tag tag--gray"
                  id="wikiDetailLevelTag"></span>
              </div>
              <p class="article-meta">
                <span class="article-meta__label" id="wikiDetailPercent"></span>
                <button type="button" class="article-meta__favorite" id="wikiDetailFavorite"
                  aria-pressed="false"><span class="favorite-star icon icon--star" aria-hidden="true"></span> 즐겨찾기</button>
              </p>
              <div class="detail-progress progress-bar" role="progressbar" id="wikiDetailProgressBar"
                aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar__fill progress-bar__fill--green" id="wikiDetailProgressFill"></div>
              </div>

              <p class="highlight-banner">
                <span class="icon icon--edit" aria-hidden="true"></span>
                <span><strong>텍스트를 드래그</strong>하면 하이라이트 저장 또는 단어장 추가를 할 수 있어요!</span>
              </p>

              <div class="article" id="artbody"></div>

              <h2 class="related-heading">관련 문서</h2>
              <div id="wikiRelatedList"></div>
            </div>
          </article>
        </div>

        <aside class="side-panel" aria-label="핸드북 저장 도구">
          <div class="save-box">
            <p class="save-box__title"><span class="icon icon--book" aria-hidden="true"></span> 내 핸드북에 저장</p>
            <button type="button" class="save-box__action" data-action="quick-favorite" id="wikiDetailFavoriteMiniBtn"
              aria-pressed="false"><span class="favorite-star icon icon--star" id="wikiDetailFavoriteMini"
                aria-hidden="true"></span> 즐겨찾기</button>
            <button type="button" class="save-box__action" data-action="toast"
              data-message="텍스트를 드래그하면 하이라이트 툴바가 나타나요!"><span class="icon icon--edit"
                aria-hidden="true"></span> 하이라이트</button>
            <button type="button" class="save-box__action" data-action="open-modal" data-word=""><span
                class="icon icon--book" aria-hidden="true"></span> 단어장 추가</button>
          </div>
          <button type="button" class="btn btn--lg btn--primary complete-btn" id="wikiCompleteBtn" data-action="toast"
            data-message="학습 완료! +20P 획득했어요!"><span class="icon icon--check" aria-hidden="true"></span> 학습
            완료</button>
          <div class="highlight-list-wrap">
            <div class="highlight-list__label">
              <span class="highlight-list__label-text"><span class="icon icon--edit" aria-hidden="true"></span>저장한
                하이라이트</span>
              <span class="tag tag--gold" id="hlcount">0</span>
            </div>
            <div class="highlight-list"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="highlight-toolbar" id="hlbar" role="toolbar" aria-label="하이라이트 도구">
    <button type="button" class="highlight-toolbar__btn highlight-toolbar__btn--yellow" data-action="apply-highlight"
      data-color="y"><span class="highlight-toolbar__dot" aria-hidden="true"></span>노란색</button>
    <button type="button" class="highlight-toolbar__btn highlight-toolbar__btn--green" data-action="apply-highlight"
      data-color="g"><span class="highlight-toolbar__dot" aria-hidden="true"></span>초록색</button>
    <button type="button" class="highlight-toolbar__btn highlight-toolbar__btn--word" data-action="highlight-to-word">
      <span class="icon icon--book" aria-hidden="true"></span>단어장</button>
  </div>

  <div id="word-modal-mount"></div>

  <script src="/assets/js/toast.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/components/profile.js" defer></script>
  <script src="/assets/js/components/search-dropdown.js" defer></script>
  <script src="/assets/js/components/header.js" defer></script>
  <script src="/assets/js/components/nav.js" defer></script>
  <script src="/assets/js/app.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/components/modal.js" defer></script>
  <script src="/assets/js/pages/wiki.js" defer></script>
  <script src="/assets/js/pages/highlight.js" defer></script>
  <script src="/assets/js/pages/mypage.js" defer></script>
</body>

</html>
