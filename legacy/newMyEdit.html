<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="padding:32px; max-width:1100px;">
      <!-- back + title -->
      <div style="display:flex; align-items:center; gap:6px; font-size:13px; color:#8a8a80; font-weight:600; margin-bottom:14px; cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        마이페이지로 돌아가기
      </div>
      <div style="display:flex; align-items:center; gap:9px; margin-bottom:6px;">
        <h1 style="margin:0; font-size:26px; font-weight:800; letter-spacing:-0.03em;">프로필 수정</h1>
        <span style="width:30px; height:30px; border-radius:9px; background:#eaf4ec; color:#2f7a4d; display:inline-flex; align-items:center; justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></span>
      </div>
      <p style="margin:0 0 32px; font-size:14px; color:#8a8a80;">계정 정보와 알림 설정을 관리하세요.</p>

      <!-- Account Information -->
      <div style="display:grid; grid-template-columns:280px 1fr; gap:32px; margin-bottom:28px;">
        <div>
          <h2 style="margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-0.02em; color:#2f6a45;">계정 정보</h2>
          <p style="margin:0; font-size:13px; color:#8a8a80;">계정 기본 정보를 관리하세요.</p>
        </div>
        <div style="background:#fff; border:1px solid #ececE8; border-radius:16px; padding:24px;">
          <label style="display:block; font-size:13px; font-weight:700; color:#3a3a34; margin-bottom:8px;">아이디</label>
          <input type="text" value="kdj4027" style="width:100%; padding:12px 15px; background:#fff; border:1px solid #ececE8; border-radius:11px; font-size:14px; font-family:inherit; color:#2c2c28; outline:none; margin-bottom:18px;">
          <label style="display:block; font-size:13px; font-weight:700; color:#3a3a34; margin-bottom:8px;">이름</label>
          <input type="text" value="DAJEONG KIM" style="width:100%; padding:12px 15px; background:#fff; border:1px solid #ececE8; border-radius:11px; font-size:14px; font-family:inherit; color:#2c2c28; outline:none; margin-bottom:16px;">
          
          <div style="display:flex; justify-content:flex-end;">
            <span style="padding:11px 26px; background:#2f7a4d; color:#fff; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer;">저장</span>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div style="display:grid; grid-template-columns:280px 1fr; gap:32px; margin-bottom:28px;">
        <div>
          <h2 style="margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-0.02em; color:#2f6a45;">이메일</h2>
          <p style="margin:0; font-size:13px; color:#8a8a80;">로그인에 사용하는 이메일 주소입니다.</p>
        </div>
        <div style="background:#fff; border:1px solid #ececE8; border-radius:16px; padding:24px;">
          <label style="display:block; font-size:13px; font-weight:700; color:#3a3a34; margin-bottom:8px;">이메일</label>
          <input type="email" value="kdj4027@gmail.com" style="width:100%; padding:12px 15px; background:#fff; border:1px solid #ececE8; border-radius:11px; font-size:14px; font-family:inherit; color:#2c2c28; outline:none; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:7px; font-size:13px; color:#c9663f; font-weight:600; margin-bottom:20px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
            로그인 이메일을 변경합니다.
          </div>
          <div style="display:flex; justify-content:flex-end;">
            <span style="padding:11px 22px; background:#fff; border:1px solid #2f7a4d; color:#2f7a4d; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer;">이메일 변경</span>
          </div>
        </div>
      </div>

      <!-- Profile photo -->
      <div style="display:grid; grid-template-columns:280px 1fr; gap:32px; margin-bottom:28px;">
        <div>
          <h2 style="margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-0.02em; color:#2f6a45;">프로필 사진</h2>
          <p style="margin:0; font-size:13px; color:#8a8a80;">프로필 사진을 변경할 수 있어요.</p>
        </div>
        <div style="background:#fff; border:1px solid #ececE8; border-radius:16px; padding:24px;">
          <div style="display:flex; align-items:center; gap:18px; margin-bottom:20px;">
            <span style="width:64px; height:64px; border-radius:50%; background:#d3ecd8; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2f7a4d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"></path><path d="M12 12c0-3 2.5-5 6-5 0 3.5-2.5 5-6 5Z"></path><path d="M12 14c0-2.5-2-4.5-5-4.5 0 3 2 4.5 5 4.5Z"></path></svg></span>
            <span style="display:inline-flex; align-items:center; gap:8px; padding:11px 20px; background:#fff; border:1px solid #ececE8; color:#3a3a34; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              사진 선택
            </span>
          </div>
          <div style="display:flex; justify-content:flex-end;">
            <span style="padding:11px 22px; background:#2f7a4d; color:#fff; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer;">업로드 &amp; 저장</span>
          </div>
        </div>
      </div>

      <!-- Delete Account -->
      <div style="display:grid; grid-template-columns:280px 1fr; gap:32px; padding-bottom:16px;">
        <div>
          <h2 style="margin:0 0 6px; font-size:17px; font-weight:800; letter-spacing:-0.02em; color:#c9663f;">계정 삭제</h2>
          <p style="margin:0; font-size:13px; color:#8a8a80;">계정을 삭제하면 되돌릴 수 없어요.</p>
        </div>
        <div style="background:#fdf3f0; border:1px solid #f0d5cc; border-radius:16px; padding:24px;">
          <p style="margin:0 0 16px; font-size:14px; color:#8a5a4a; line-height:1.6;">계정 삭제는 영구적이며 되돌릴 수 없습니다. 삭제 후에는 누구도 계정을 복구할 수 없어요.</p>
          <label style="display:flex; align-items:center; gap:9px; font-size:13px; color:#8a5a4a; cursor:pointer; margin-bottom:20px;">
            <span style="width:18px; height:18px; border-radius:5px; border:1.5px solid #dcb0a0; background:#fff; flex-shrink:0;"></span>
            이 작업이 영구적이며 되돌릴 수 없음을 이해했습니다.
          </label>
          <div style="display:flex; justify-content:flex-end;">
            <span style="padding:11px 22px; background:#f0e2dc; color:#b8a098; border-radius:12px; font-size:14px; font-weight:700; cursor:not-allowed;">계정 삭제</span>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
